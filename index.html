<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>くだらないブラウザゲーム集</title>
  <meta name="description" content="くだらないけど、ちょっと面白い。すぐ遊べる短いブラウザゲーム集。">
  <style>
    :root {
      --bg: #e9e4d8;
      --text: #2b2620;
      --muted: #6b6257;
      --panel: #fffdf8;
      --border: #cfc6b5;
      --ink: #c42a2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 {
      margin: 0 0 8px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 1.6rem;
      letter-spacing: 0.1em;
    }
    .lead { margin: 0 0 24px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.card {
      display: block;
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
    }
    a.card:hover, a.card:focus-visible { border-color: var(--ink); }
    .card h2 { margin: 0 0 4px; font-size: 1.15rem; color: var(--ink); }
    .card p { margin: 0; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>くだらないブラウザゲーム集</h1>
    <p class="lead">くだらないけど、ちょっと面白い。登録なしで、すぐ遊べます。</p>
    <ul>
      <li>
        <a class="card" href="games/02-ojigi-hanko/">
          <h2>お辞儀ハンコ</h2>
          <p>上司の印の方へ、ちょうどよく傾けてハンコを押す。</p>
        </a>
      </li>
    </ul>
  </main>

</body>
</html>
